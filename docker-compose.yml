services:

  # --- Messaging backbone ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers, one for your host machine
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"   # what your local Python scripts connect to
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional but very useful while developing: a GUI to see topics/messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # --- Zero-Trust API Gateway (FastAPI) ---
  gateway:
    build:
      context: ./gateway
    container_name: gateway
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:9092}
      TOPIC_TELEMETRY_RAW: ${TOPIC_TELEMETRY_RAW:-iomt.telemetry.raw}
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-dev-shared-secret-change-me}
    volumes:
      - ./gateway:/app   # live code reload while developing
      - ./data:/app/data:ro   # patient registry (read-only — gateway doesn't modify it)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --ssl-keyfile=/app/key.pem --ssl-certfile=/app/cert.pem

# --- Dashboard API (reads scored telemetry, serves the live SOC page) ---
  dashboard-api:
    build:
      context: ./dashboard-api
    container_name: dashboard-api
    depends_on:
      - kafka
    ports:
      - "8100:8100"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:9092}
      TOPIC_TELEMETRY_SCORED: ${TOPIC_TELEMETRY_SCORED:-iomt.telemetry.scored}
      RISK_ALERT_THRESHOLD: ${RISK_ALERT_THRESHOLD:-70}
    volumes:
      - ./dashboard-api:/app   # live code reload while developing
    command: uvicorn main:app --host 0.0.0.0 --port 8100 --reload

  # --- Stream preprocessing + scoring (David's consumer) ---
  stream-consumer:
    build:
      context: ./stream
    container_name: stream-consumer
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS_HOST: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:9092}
      TOPIC_TELEMETRY_RAW: ${TOPIC_TELEMETRY_RAW:-iomt.telemetry.raw}
      TOPIC_TELEMETRY_SCORED: ${TOPIC_TELEMETRY_SCORED:-iomt.telemetry.scored}

  # --- Postgres for storing device metadata / risk scores ---
  db:
    image: postgres:16-alpine
    container_name: iomt-db
    environment:
      POSTGRES_USER: medguard
      POSTGRES_PASSWORD: medguard_dev
      POSTGRES_DB: medguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: