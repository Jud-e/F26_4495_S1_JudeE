<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedGuard SOC (dev view)</title>
<style>
:root{--bg:#F5F7F8;--surface:#fff;--fg:#14212B;--muted:#566574;--line:#C9D3DA;--ok:#0B6B63;--ok-bg:#E1F3F0;
  --warn:#8A4B08;--warn-bg:#FBEFD9;--crit:#A1262B;--crit-bg:#FBE4E4;--bar:#DCE3E8;
  --mono:ui-monospace,Consolas,"SF Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A21;--surface:#16242D;--fg:#E6EDF1;--muted:#9AABB8;--line:#2C3E4A;
  --ok:#5FD4C6;--ok-bg:#123B38;--warn:#F2B84B;--warn-bg:#3A2D12;--crit:#FF8A8F;--crit-bg:#3F1A1D;--bar:#223540;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding:24px 16px 40px}
main{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.crit{color:var(--crit);background:var(--crit-bg)}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.id{font-weight:600} .sub{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.riskcell{display:flex;align-items:center;gap:8px;min-width:120px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.mid{background:var(--warn)} .bar i.high{background:var(--crit)}
.num{font-variant-numeric:tabular-nums;font-weight:600;width:2.2em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.alerts{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;margin:0;padding:0;list-style:none}
.alerts li{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--muted);padding:16px 4px}
.note{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>MedGuard SOC</h1><div class="note">Development view. The final dashboard replaces this page.</div></div>
    <div><span id="conn" class="pill warn">connecting</span> <span id="count" class="note"></span></div>
  </header>
  <div class="cols">
    <section class="panel">
      <h2>Devices</h2>
      <div class="scroll"><table>
        <thead><tr><th>Device</th><th>Risk</th><th>Flags</th><th>Readings</th><th>Last seen</th></tr></thead>
        <tbody id="devices"></tbody>
      </table></div>
      <div id="devices-empty" class="empty">Waiting for scored messages. Run the simulator and the stream consumer.</div>
    </section>
    <section class="panel">
      <h2>Alerts</h2>
      <ul id="alerts" class="alerts"></ul>
      <div id="alerts-empty" class="empty">No alerts yet.</div>
    </section>
  </div>
</main>
<script>
const CRIT = new Set(["infusion_rate_mismatch","high_risk_score"]);
const devices = new Map();   // device_id -> state
let alerts = [];

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function riskClass(n){ return n>=70 ? "high" : n>=40 ? "mid" : ""; }
function ago(iso){
  if(!iso) return "-"; const s=(Date.now()-new Date(iso).getTime())/1000;
  if(isNaN(s)) return iso; if(s<5) return "just now"; if(s<60) return Math.round(s)+"s ago";
  if(s<3600) return Math.round(s/60)+" min ago"; return Math.round(s/3600)+" h ago";
}
function chips(list){ const w=el("div","chips"); (list||[]).forEach(f=>w.appendChild(el("span","chip"+(CRIT.has(f)?" crit":""),f))); return w; }
function readings(v){ return Object.entries(v||{}).map(([k,x])=>k.replace(/_(ml_per_hr|mmHg|pct|bpm)$/,"")+" "+x).join(" · "); }

function renderDevices(){
  const rows = [...devices.values()].sort((a,b)=> b.risk_score-a.risk_score || a.device_id.localeCompare(b.device_id));
  const tb = document.getElementById("devices"); tb.replaceChildren();
  rows.forEach(d=>{
    const tr=document.createElement("tr");
    const c1=el("td"); c1.append(el("div","id",d.device_id), el("div","sub",[d.device_type,d.unit,d.patient_id].filter(Boolean).join(" · ")));
    const c2=el("td"); const rc=el("div","riskcell"); const bar=el("div","bar"); const fill=el("i",riskClass(d.risk_score)); fill.style.width=Math.min(100,d.risk_score)+"%"; bar.appendChild(fill);
    rc.append(bar, el("span","num",String(d.risk_score))); c2.appendChild(rc);
    if(d.model_version) c2.appendChild(el("div","sub mono",d.model_version));
    const c3=el("td"); c3.appendChild(d.flags.length? chips(d.flags): el("span","sub","none"));
    const c4=el("td","sub",readings(d.vitals));
    const c5=el("td","sub",ago(d.last_seen));
    tr.append(c1,c2,c3,c4,c5); tb.appendChild(tr);
  });
  document.getElementById("devices-empty").hidden = rows.length>0;
  document.getElementById("count").textContent = rows.length+" device"+(rows.length===1?"":"s");
}
function renderAlerts(){
  const ul=document.getElementById("alerts"); ul.replaceChildren();
  alerts.slice(0,50).forEach(a=>{
    const li=document.createElement("li");
    const top=el("div"); top.append(el("span","pill "+(a.severity==="high"?"crit":"warn"),a.severity), " ", el("strong","",a.device_id));
    li.append(top, chips(a.reasons));
    (a.tips||[]).slice(0,2).forEach(t=>li.appendChild(el("div","sub",t)));
    li.appendChild(el("div","sub",ago(a.at)+" · risk "+a.risk_score));
    ul.appendChild(li);
  });
  document.getElementById("alerts-empty").hidden = alerts.length>0;
}

let retry=1000;
function setConn(ok){ const c=document.getElementById("conn"); c.textContent = ok?"live":"reconnecting"; c.className="pill "+(ok?"ok":"warn"); }
function connect(){
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>{ setConn(true); retry=1000; };
  ws.onmessage=(m)=>{
    const ev=JSON.parse(m.data);
    if(ev.type==="snapshot"){ devices.clear(); ev.devices.forEach(d=>devices.set(d.device_id,d)); alerts=ev.alerts; }
    else if(ev.type==="device"){ devices.set(ev.device.device_id, ev.device); }
    else if(ev.type==="alert"){ alerts.unshift(ev.alert); }
    renderDevices(); renderAlerts();
  };
  ws.onclose=()=>{ setConn(false); setTimeout(connect, retry); retry=Math.min(retry*2,10000); };
}
connect(); setInterval(renderDevices, 15000);
</script>
</body>
</html>
